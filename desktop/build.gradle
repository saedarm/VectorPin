// Configuration for :desktop lives in the root build.gradle.
sourceSets.main.java.srcDirs = ['src/']

// Bundle the shared root-level assets/ folder onto the runtime classpath
// so both `run` and the packaged distribution can find data/field_layout.json.
sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

// ./gradlew desktop:run
tasks.named('run') {
    setWorkingDir(rootProject.file('assets'))
    setIgnoreExitValue(true)
}
